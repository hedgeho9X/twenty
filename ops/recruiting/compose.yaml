name: twenty-recruiting
services:
  db:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    env_file: ../../.local/recruiting/postgres.env
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [local]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty -d recruiting"]
      interval: 3s
      timeout: 3s
      retries: 20
  cache:
    image: valkey/valkey:7@sha256:828b1cbb1c258e02b9cd9588063fa997e097444e610d3f3c00d43e21400e2b8d
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["127.0.0.1:26379:6379"]
    volumes: ["cache:/data"]
    networks: [local]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  parser:
    image: twenty-recruiting/parser:docling-2.145.0
    profiles: [parser]
    build: ./parser
    user: "${RECRUITING_UID:-501}:${RECRUITING_GID:-20}"
    env_file: ../../.local/recruiting/parser.env
    environment:
      HOME: /tmp
    ports: ["127.0.0.1:23003:8000"]
    volumes:
      - ../../.local/recruiting/storage:/data/input:ro
      - ../../.local/recruiting/parser-output:/data/output
      - ../../.local/recruiting/models:/models:ro
    read_only: true
    tmpfs: ["/tmp:size=1g"]
    shm_size: 256mb
    mem_limit: 6g
    cpus: 4
    networks: [local]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  minio:
    image: twenty-recruiting/minio:7aac2a2c5b7c
    profiles: [minio]
    env_file: ../../.local/recruiting/minio.env
    ports: ["127.0.0.1:23004:9000", "127.0.0.1:23005:9001"]
    volumes: ["object-storage:/data"]
    networks: [local]
    mem_limit: 2g
    cpus: 2
  mail-test:
    image: greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f
    profiles: [mail-test]
    env_file: ../../.local/recruiting/mail-test/server.env
    environment:
      JAVA_OPTS: -Djava.net.preferIPv4Stack=true -Xmx256m
    ports:
      - "127.0.0.1:23025:3025"
      - "127.0.0.1:23143:3143"
      - "127.0.0.1:23080:8080"
    mem_limit: 512m
    cpus: 1
    networks: [local]
networks:
  local: {}
volumes:
  database:
  cache:
  object-storage:
