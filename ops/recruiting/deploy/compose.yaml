# Production application stack. Dokploy owns routing; secrets live in its environment.
services:
  server:
    mem_limit: 1280m
    image: ghcr.io/hedgeho9x/fanhan-twenty:fanhan-bootstrap
    restart: unless-stopped
    environment: &application-environment
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      NODE_PORT: 3000
      SERVER_URL: ${FANHAN_PUBLIC_URL:?required}
      FRONTEND_URL: ${FANHAN_PUBLIC_URL:?required}
      PG_DATABASE_URL: postgres://twenty:${POSTGRES_PASSWORD:?required}@db:5432/twenty
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET:?required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/packages/twenty-server/.local-storage
      RECRUITING_STATE_SIGNING_KEY: ${RECRUITING_STATE_SIGNING_KEY:?required}
      RECRUITING_PARSER_URL: http://parser:8000
      RECRUITING_PARSER_TOKEN: ${RECRUITING_PARSER_TOKEN:?required}
      RECRUITING_PARSER_OUTPUT_ROOT: /data/parser-output
      RECRUITING_CHATGPT_CONNECTIONS_PATH: /data/chatgpt-subscriptions
      RECRUITING_AUTO_MATCH_ENABLED: ${RECRUITING_AUTO_MATCH_ENABLED:-}
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
    volumes:
      - files:/app/packages/twenty-server/.local-storage
      - parser-output:/data/parser-output:ro
      - subscriptions:/data/chatgpt-subscriptions
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:3000/healthz]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [default, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.http.routers.fanhan-ip.rule=Host(`${FANHAN_HTTP_HOST:?required}`)
      - traefik.http.routers.fanhan-ip.entrypoints=web
      - traefik.http.routers.fanhan-ip.service=fanhan
      - traefik.http.routers.fanhan-ip-secure.rule=Host(`${FANHAN_HTTP_HOST:?required}`)
      - traefik.http.routers.fanhan-ip-secure.entrypoints=websecure
      - traefik.http.routers.fanhan-ip-secure.service=fanhan
      - traefik.http.routers.fanhan-ip-secure.tls=true
      - traefik.http.routers.fanhan-ip-secure.priority=100
      - traefik.http.services.fanhan.loadbalancer.server.port=3000
      - traefik.docker.network=dokploy-network

  worker:
    mem_limit: 1024m
    image: ghcr.io/hedgeho9x/fanhan-twenty:fanhan-bootstrap
    command: [node, dist/queue-worker/queue-worker]
    restart: unless-stopped
    environment:
      <<: *application-environment
      PG_DATABASE_PRIMARY_TIMEOUT_MS: 120000
      PG_DATABASE_REPLICA_TIMEOUT_MS: 120000
    volumes:
      - files:/app/packages/twenty-server/.local-storage
      - parser-output:/data/parser-output:ro
      - subscriptions:/data/chatgpt-subscriptions
    depends_on:
      server:
        condition: service_healthy
      parser:
        condition: service_healthy

  parser:
    image: ghcr.io/hedgeho9x/fanhan-mineru:fanhan-bootstrap
    mem_limit: 1536m
    restart: unless-stopped
    environment:
      MINERU_API_KEY: ${MINERU_API_KEY:?required}
      RECRUITING_PARSER_TOKEN: ${RECRUITING_PARSER_TOKEN:?required}
    volumes:
      - files:/data/input:ro
      - parser-output:/data/output
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  migrate:
    mem_limit: 1536m
    image: ghcr.io/hedgeho9x/fanhan-twenty:fanhan-bootstrap
    user: '0'
    command:
      - sh
      - -ec
      - |
        chown 1000:1000 /data/parser-output /data/chatgpt-subscriptions
        chmod 700 /data/parser-output /data/chatgpt-subscriptions
        exec node scripts/recruiting-release.mjs
    environment:
      <<: *application-environment
    volumes:
      - backups:/data/backups
      - parser-output:/data/parser-output
      - subscriptions:/data/chatgpt-subscriptions
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    mem_limit: 640m
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U twenty -d twenty']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Leave room for an AOF rewrite child, copy-on-write pages and allocator overhead.
    mem_limit: 1g
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
      - --auto-aof-rewrite-min-size
      - 256mb
    restart: unless-stopped
    volumes:
      - cache:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  dokploy-network:
    external: true

volumes:
  files:
  database:
  cache:
  parser-output:
  subscriptions:
  backups:
