# Production application stack. Dokploy owns routing; secrets live in its environment.
services:
  server:
    image: fanhan/twenty:fanhan-bootstrap
    pull_policy: never
    restart: unless-stopped
    environment: &application-environment
      NODE_ENV: production
      NODE_PORT: 3000
      SERVER_URL: http://150.158.164.85
      FRONTEND_URL: http://150.158.164.85
      PG_DATABASE_URL: postgres://twenty:${POSTGRES_PASSWORD:?required}@db:5432/twenty
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET:?required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/packages/twenty-server/.local-storage
      RECRUITING_STATE_SIGNING_KEY: ${RECRUITING_STATE_SIGNING_KEY:?required}
      RECRUITING_PARSER_URL: ${RECRUITING_PARSER_URL:-}
      RECRUITING_PARSER_TOKEN: ${RECRUITING_PARSER_TOKEN:-}
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
    volumes:
      - files:/app/packages/twenty-server/.local-storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:3000/healthz]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [default, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.http.routers.fanhan.rule=Host(`recruiting.math77.cn`)
      - traefik.http.routers.fanhan.entrypoints=websecure
      - traefik.http.routers.fanhan.tls.certresolver=letsencrypt
      - traefik.http.routers.fanhan-ip.rule=Host(`150.158.164.85`)
      - traefik.http.routers.fanhan-ip.entrypoints=web
      - traefik.http.routers.fanhan-ip.service=fanhan
      - traefik.http.services.fanhan.loadbalancer.server.port=3000
      - traefik.docker.network=dokploy-network

  worker:
    image: fanhan/twenty:fanhan-bootstrap
    pull_policy: never
    command: [node, dist/queue-worker/queue-worker]
    restart: unless-stopped
    environment:
      <<: *application-environment
    volumes:
      - files:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy

  migrate:
    image: fanhan/twenty:fanhan-bootstrap
    pull_policy: never
    user: '0'
    command: [node, scripts/recruiting-release.mjs]
    environment:
      <<: *application-environment
    volumes:
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U twenty -d twenty']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes:
      - cache:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  dokploy-network:
    external: true

volumes:
  files:
  database:
  cache:
  backups:
