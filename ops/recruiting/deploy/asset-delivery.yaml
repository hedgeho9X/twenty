# Dokploy Traefik file configuration for hashed frontend assets on the Tencent host.
http:
  routers:
    fanhan-assets:
      rule: Host(`43.136.55.30`) && PathRegexp(`^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$`)
      entryPoints:
        - websecure
      priority: 200
      service: fanhan@docker
      middlewares:
        - fanhan-assets-compress
        - fanhan-assets-cache
      tls: {}
  middlewares:
    fanhan-assets-compress:
      compress:
        encodings:
          - gzip
        minResponseBodyBytes: 1024
    fanhan-assets-cache:
      headers:
        customResponseHeaders:
          Cache-Control: public, max-age=31536000, immutable
