name: Fanhan production

on:
  push:
    branches: [deploy/fanhan]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fanhan-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/yarn-install
      - name: Build shared package
        run: node ops/recruiting/build-source.mjs twenty-shared build
      - name: Build workspace package exports
        run: yarn nx run-many -t build -p twenty-ui twenty-emails twenty-client-sdk twenty-sdk twenty-front-component-renderer
      - name: CLI regression
        run: node --test ops/recruiting/cli-auth.test.mjs ops/recruiting/cli.test.mjs ops/recruiting/cli-job-upload.test.mjs
      - name: Server regression
        working-directory: packages/twenty-server
        run: ../../node_modules/.bin/jest --runInBand --testPathPattern='src/modules/recruiting/|chatgpt-subscription/|is-provider-configured.util.spec'
      - name: Frontend regression
        working-directory: packages/twenty-front
        run: ../../node_modules/.bin/jest --runInBand --testPathPattern='recruiting|SettingsBriefTemplates|apiProxyPrefixes'
      - name: Server types
        working-directory: packages/twenty-server
        run: ../../node_modules/.bin/tsgo -p tsconfig.json --noEmit --incremental false
      - name: Frontend types
        working-directory: packages/twenty-front
        run: ../../node_modules/.bin/tsgo -p tsconfig.json --noEmit --incremental false

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: fanhan-production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          load: true
          platforms: linux/amd64
          tags: fanhan/twenty:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Transfer image over authenticated SSH
        env:
          DEPLOY_KEY: ${{ secrets.FANHAN_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.FANHAN_KNOWN_HOSTS }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/fanhan
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/fanhan ~/.ssh/known_hosts
          { printf '%s\n' "$REVISION"; docker save "fanhan/twenty:$REVISION" | gzip -1; } | \
            ssh -i ~/.ssh/fanhan -o BatchMode=yes -o StrictHostKeyChecking=yes fanhan-deploy@150.158.164.85
          rm -f ~/.ssh/fanhan
      - name: Deploy exact verified revision
        env:
          DOKPLOY_URL: ${{ secrets.FANHAN_DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.FANHAN_DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.FANHAN_DOKPLOY_COMPOSE_ID }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DOKPLOY_URL" && test -n "$DOKPLOY_API_KEY" && test -n "$DOKPLOY_COMPOSE_ID"
          sed "s/:fanhan-bootstrap/:$REVISION/g" ops/recruiting/deploy/compose.yaml > /tmp/fanhan-compose.yaml
          jq -n --arg id "$DOKPLOY_COMPOSE_ID" --rawfile compose /tmp/fanhan-compose.yaml \
            '{composeId:$id, composeFile:$compose}' > /tmp/fanhan-update.json
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            --data-binary @/tmp/fanhan-update.json "$DOKPLOY_URL/api/compose.update" > /dev/null
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg id "$DOKPLOY_COMPOSE_ID" --arg revision "$REVISION" '{composeId:$id, title:("Verified release " + $revision), description:$revision}')" \
            "$DOKPLOY_URL/api/compose.deploy"
      - name: Verify deployed revision
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 10 https://recruiting.math77.cn/healthz >/dev/null && \
               curl --fail --silent --max-time 10 https://recruiting.math77.cn/client-config | jq -e --arg revision "$REVISION" '.appVersion == $revision' >/dev/null; then
              echo "Verified deployed revision $REVISION"
              exit 0
            fi
            sleep 10
          done
          echo 'Deployment did not become healthy at the expected revision' >&2
          exit 1
